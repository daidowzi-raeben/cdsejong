	<script>
	$(document).ready(function() {
		// 로딩 화면 표시
		$("#loadingPop").show();
		
		// 비디오 요소 가져오기
		var video = document.getElementById('video');
		
		// 비디오 메타데이터가 로드되면 실행
		video.addEventListener('loadedmetadata', function() {
			// 로딩 화면을 1초 동안 보여준 후 페이드아웃
			setTimeout(function() {
				$("#loadingPop").fadeOut(300, function() {
					// 로딩 화면이 사라진 후 비디오 재생
					startVideo();
				});
			}, 1000);
		});

		// 비디오 재생 함수 - 데스크탑 브라우저 호환성 개선
		function startVideo() {
			if (video) {
				// 볼륨 설정 (음소거 해제 후 사용됨)
				video.volume = 1.0;
				// 음소거 해제
				video.muted = false;
				// 기본 컨트롤바 비활성화
				video.controls = false;
			
				// 자동 재생 시도
				var playPromise = video.play();
				
				if (playPromise !== undefined) {
					playPromise.then(function() {
						// 재생 성공
						console.log("비디오 재생 시작");
						// 사용자 상호작용 후 음소거 해제 가능하도록 버튼 이벤트 추가
						$("#muteBtn").on("click", function() {
							video.muted = !video.muted;
						});
					}).catch(function(error) {
						// 재생 실패 시 수동 재생 버튼 표시
						console.log("자동 재생 실패:", error);
						$("#playBtn").show();
						$("#pauseBtn").hide();
					});
				}
			}
		}

		// 비디오 로드 시작 시
		video.addEventListener('loadstart', function() {
			console.log('비디오 로드 시작');
			$("#videoCtn").show();
		});

		// 비디오 재생 가능 시
		video.addEventListener('canplay', function() {
			console.log('비디오 재생 가능');
			$("#videoCtn").show();
		});

		// 비디오 재생 시도 시
		video.addEventListener('play', function() {
			console.log('비디오 재생 시도');
		});

		// 비디오 재생 중
		video.addEventListener('playing', function() {
			console.log('비디오 재생 중');
		});

		// 비디오 일시 정지
		video.addEventListener('pause', function() {
			console.log('비디오 일시 정지');
		});

		// 비디오 에러 발생 시
		video.addEventListener('error', function(e) {
			console.error('비디오 에러:', e);
			console.log('비디오 소스:', video.src);
		});
	});
	</script>

	<script>
// 영상 페이지가 로드되면 실행
document.addEventListener('DOMContentLoaded', function() {
    // 다음 버튼 요소 가져오기
    const nextBtn = document.getElementById('nextBtn');
    
    // 비디오 요소 가져오기
    const video = document.getElementById('video');
    
    // 다음 버튼 비활성화 함수
    function disableNextButton() {
        nextBtn.style.pointerEvents = 'none';
        nextBtn.style.opacity = '0.5';
    }
    
    // 초기 상태에서 다음 버튼 비활성화
    disableNextButton();
    
    // 비디오 이벤트 리스너
    video.addEventListener('ended', function() {
        // 비디오가 끝나도 다음 버튼 비활성화 유지
        disableNextButton();
    });
    
    // 비디오 재생 중에도 다음 버튼 비활성화 유지
    video.addEventListener('play', function() {
        disableNextButton();
    });
    
    // 비디오 일시정지 시에도 다음 버튼 비활성화 유지
    video.addEventListener('pause', function() {
        disableNextButton();
    });
});
</script>
	
	<script>
    // 페이지가 로드되면 실행
    document.addEventListener('DOMContentLoaded', function() {
    // 필요한 요소들 가져오기
    const nextBtn = document.getElementById('nextBtn');
    const multipleQuizCtn = document.getElementById('multipleQuizCtn');
    const quiz_cover = document.getElementById('quiz_cover');
    
    // 퀴즈 완료 여부를 추적하는 변수
    let quizCompleted = false;
    
    // 다음 버튼 비활성화 함수
    function disableNextButton() {
        nextBtn.style.pointerEvents = 'none';  // 클릭 비활성화
        nextBtn.style.opacity = '0.5';         // 시각적으로 비활성화 표시
    }
    
    // 다음 버튼 활성화 함수
    function enableNextButton() {
        nextBtn.style.pointerEvents = 'auto';  // 클릭 활성화
        nextBtn.style.opacity = '1';           // 시각적으로 활성화 표시
    }
    
    // 초기 상태에서는 다음 버튼 비활성화
    disableNextButton();
    
    // 퀴즈 결과 버튼 클릭 이벤트 감지
    document.getElementById('multipleQuiz_resultBtn').addEventListener('click', function() {
        quizCompleted = true;
        enableNextButton();  // 퀴즈 완료 후 다음 버튼 활성화
    });
    
    // 퀴즈 재시작 시 다음 버튼 다시 비활성화
    document.getElementById('multipleQuiz_restartBtn').addEventListener('click', function() {
        quizCompleted = false;
        disableNextButton();
    });
});
</script>
