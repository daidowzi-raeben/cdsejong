    <body onselectstart="return false" oncontextmenu="return false">
        <div id="container">
            <div id="top-wrapper">
                <span class="chapter"></span>
            </div>
            <div id="content-wrapper">
                <div id="quiz-wrapper">
                    <div id="quiz-home">
                        <p class="btn-start"></p>
                    </div>
                    <div id="quiz-content">
                        <ul class="quiz-tab"></ul>
                        <span class="quiz-num"></span>
                        <span class="quiz-question"></span>
                        <div class="ox-wrapper">
                            <input type="radio" name="ox" id="ox-o"><label for="ox-o"></label>
                            <input type="radio" name="ox" id="ox-x"><label for="ox-x"></label>
                        </div>
                        <div class="choice-wrapper"></div>
                        <div class="input-wrapper">
                            <input type="text" name="input-text" id="input-text">
                        </div>
                        <p class="btn-confirm"></p>
                        <div class="pop"></div>
                        <div class="answer-wrapper">
                            <span></span><span class="answer-answer">1</span>
                            <span></span><div class="answer-comment"><span></span></div>
                            <p class="btn-next"></p>
                        </div>
                        <div class="cover"></div>
                    </div>
                    <div id="quiz-result">
                        <span class="quiz-count">0</span>
                        <span class="quiz-score">0</span>
                        <table class="quiz-result">
                            <thead>
                                <tr></tr>
                            </thead>
                            <tbody>
                                <tr></tr>
                            </tbody>
                        </table>
                        <p class="btn-restart"></p>
                    </div>
                </div>
            </div>

            <div id="toolbar-mobile">
                <p class="btn-prev"></p>
                <p class="btn-next"></p>
            </div>
            <div id="toolbar">
                <div class="timebar-wrapper">
                    <p class="timebar"><span class="time-range"></span></p>
                    <time class="currtime" title="현재시간">00:00</time>
                    <time class="duration" title="전체시간">00:00</time>
                </div>
                <div class="speed-wrapper">
                    <p class="btn-slow"></p>
                    <span class="currspeed">1.0</span><span>배속</span>
                    <p class="btn-fast"></p>
                </div>
                <p class="btn-play" title="재생"></p>
                <p class="btn-pause on" title="일시정지"></p>
                <p class="btn-replay" title="다시보기"></p>
                <div class="script-wrapper">
                    <p class="btn-close"></p>
                    <div class="script-inner">
                        <span>내레이션</span>
                        <span></span>
                    </div>
                </div>
                <p class="btn-script"></p>
                <p class="btn-mute"></p>
                <div class="volbar"><p class="vol-bar"><span class="vol-range"></span></p></div>
                <p class="btn-fullscreen"></p>
                <div class="page-wrapper">
                    <p class="btn-prev"></p>
					<span id="curpageTxt" class="currPage"><script>document.write(isPageNum)</script></span>
		      		<span id="totalpageTxt" class="totalpage"><script>document.write(isTotalNum)</script></span>
                    <p class="btn-next"></p>
                </div>
                <span class="pop-next"></p>
            </div>
        </div>

    <!-- quiz -->
    <script>
        /* quiz
         * type 0 : ox / 1 : 객관식 / 2 : 주관식
         * question : 문제 {강조}
         * choice : 객관식 보기
         * answer : 정답
         * comment : 해설
         * choiceposition : 보기 위치
         */
        const o = true;
        const x = false;
        const quiz = [{
            type: 1,
			choiceposition: 260,
            question: '최준법 과장은 다음과 같은 일을 추진하고자 한다. 이 중 법적으로 허용되는 것은 어느 것인가?',
            choice: ['NS가 주식 전부를 보유한 A회사(100% 자회사)에 대하여 부당하게 자산, 인력 등을 지원하는 행위',
			'NS와 아무런 계열관계에 없는 B회사에 대하여 자산, 인력 등을 부당하게 지원하는 행위',
			'NS가 임차하여 사용중인 건물을 NS의 계열회사인 C회사에게 훨씬 더 싼 가격으로 다시 임대해 주는 행위',
			'NS에 파견되어 근무하는 D회사(NS의 계열회사) 소속직원으로부터 그 근무 과정에서 얻은 노하우를 제공받아 업무에 활용하는 행위'
			],
            answer: 4,
            comment: '독점규제 및 공정거래에 관한 법률 제23조 제1항 제7호에 따르면 특수관계인 또는 타 회사에 대하여 자산, 인력 등을 제공하여 지원하거나 상당히 유리한 조건으로 거래하는 행위가 금지됩니다. 단, 인력지원의 경우 인건비 정산 등이 제대로 이루어진 경우라면 파견근무 과정에서 얻은 노하우를 당해 계열회사 상호간에 공유한다고 하여 부당지원으로 보지 않고 허용됩니다.'
	        },{

            type: 1,
			choiceposition: 280,
            question: '김공정 대리는 특약매입거래로 방송을 진행하였다. 이후 해당 방송을 통해 판매한 상품의 상품판매대금을 월 판매마감일로부터 50일 후에 지급하였다. 김공정 대리의 행위는 적법한가?',
            choice: ['적법',
			'위법'],
            answer: 2,
            comment: '대규모유통업에서의 거래 공정화에 관한 법률 제8조에 의하면 대규모유통업자는 상품의 판매대금을 월 판매마감일로부터 40일 이내에 납품업자등에게 지급하여야 합니다. 또한 대규모유통업자가 상품판매대금을 월 판매마감일로부터 40일이 지난 후에 지급하는 경우에는 그 초과 기간에 대하여 공정거래위원회 고시에 따라 연 15.5% 의 이자를 지급하여야 합니다.'
			}];
    </script>
