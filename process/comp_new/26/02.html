        <title>e-준법교육 퀴즈 캠페인</title>
        <!-- library -->

    <body onselectstart="return false" oncontextmenu="return false">
        <div id="container">
            <div id="top-wrapper">
                <span class="chapter"></span>
            </div>
            <div id="content-wrapper">
                <div id="quiz-wrapper">
                    <div id="quiz-home">
                        <p class="btn-start"></p>
                    </div>
                    <div id="quiz-content">
                        <ul class="quiz-tab"></ul>
                        <span class="quiz-num"></span>
                        <span class="quiz-question"></span>
                        <div class="ox-wrapper">
                            <input type="radio" name="ox" id="ox-o"><label for="ox-o"></label>
                            <input type="radio" name="ox" id="ox-x"><label for="ox-x"></label>
                        </div>
                        <div class="choice-wrapper"></div>
                        <div class="input-wrapper">
                            <input type="text" name="input-text" id="input-text">
                        </div>
                        <p class="btn-confirm"></p>
                        <div class="pop"></div>
                        <div class="answer-wrapper">
                            <span></span><span class="answer-answer">1</span>
                            <span></span><div class="answer-comment"><span></span></div>
                            <p class="btn-next"></p>
                        </div>
                        <div class="cover"></div>
                    </div>
                    <div id="quiz-result">
                        <span class="quiz-count">0</span>
                        <span class="quiz-score">0</span>
                        <table class="quiz-result">
                            <thead>
                                <tr></tr>
                            </thead>
                            <tbody>
                                <tr></tr>
                            </tbody>
                        </table>
                        <p class="btn-restart"></p>
                    </div>
                </div>
            </div>

            <div id="toolbar-mobile">
                <p class="btn-prev"></p>
                <p class="btn-next"></p>
            </div>
            <div id="toolbar">
                <div class="timebar-wrapper">
                    <p class="timebar"><span class="time-range"></span></p>
                    <time class="currtime" title="현재시간">00:00</time>
                    <time class="duration" title="전체시간">00:00</time>
                </div>
                <div class="speed-wrapper">
                    <p class="btn-slow"></p>
                    <span class="currspeed">1.0</span><span>배속</span>
                    <p class="btn-fast"></p>
                </div>
                <p class="btn-play" title="재생"></p>
                <p class="btn-pause on" title="일시정지"></p>
                <p class="btn-replay" title="다시보기"></p>
                <div class="script-wrapper">
                    <p class="btn-close"></p>
                    <div class="script-inner">
                        <span>내레이션</span>
                        <span></span>
                    </div>
                </div>
                <p class="btn-script"></p>
                <p class="btn-mute"></p>
                <div class="volbar"><p class="vol-bar"><span class="vol-range"></span></p></div>
                <p class="btn-fullscreen"></p>
                <div class="page-wrapper">
                    <p class="btn-prev"></p>
					<span id="curpageTxt" class="currPage"><script>document.write(isPageNum)</script></span>
		      		<span id="totalpageTxt" class="totalpage"><script>document.write(isTotalNum)</script></span>
                    <p class="btn-next"></p>
                </div>
                <span class="pop-next"></p>
            </div>
        </div>

    <!-- quiz -->
    <script>
        /* quiz
         * type 0 : ox / 1 : 객관식 / 2 : 주관식
         * question : 문제 {강조}
         * choice : 객관식 보기
         * answer : 정답
         * comment : 해설
         * choiceposition : 보기 위치
         */
        const o = true;
        const x = false;
        const quiz = [{
            type: 1,
            choiceposition: 260,
            question: '다음 중 이경영 차장이 ‘방송법’과 관련하여 NS홈쇼핑에 대하여 설명하는 내용 중 틀린 것은 무엇인가?',
            choice: ['NS홈쇼핑(㈜NS쇼핑)은 방송법상 ‘방송채널사용사업자’로 승인 받았다.',
			'NS홈쇼핑은 시청자가 방송프로그램의 기획/편성/제작에 관한 의사결정에 참여할 수 있도록 해야 한다.',
			'NS홈쇼핑은 ‘상품소개와 판매에 관한 전문편성’을 하는 방송채널사용사업자이므로, 방송법상의 방송의 ‘공적책임’, ‘공정성’과 ‘공익성’ 규정이 적용되지 않는다.',
			'NS홈쇼핑은 방송 프로그램 및 방송 광고의 원본 또는 사본을 방송 후 6개월간 보존해야 한다.'
			],
            answer: 3,
            comment: '방송법 제5조 및 제6조에 의하면, TV, 라디오, 데이터, 이동멀티미디어방송은 모두 방송법상의 ‘방송’으로서, ‘방송의 공적 책임’ 및 ‘방송의 공정성과 공익성’ 규정이 적용됩니다.④번의 경우는 방송법 제83조 제2항에 규정되어 있고, 보존 대상에는 ‘예고방송’도 포함되며, ‘재송신’은 제외됩니다.'

	        },{

            type: 1,
            choiceposition: 260,
            question: '다음 중 ‘제조물책임’에 대한 설명으로 틀린 것은 무엇인가?',
            choice: ['가공된 농축수산물(예: 조미김)도 ‘제조물책임법’상 제조물에 해당한다.',
			'제품의 단순한 품질 하자의 경우에는 ‘제조물책임’을 물을 수 없다.',
			'‘제조물책임’은 제조업자만 부담하고, 판매자인 NS는 어떠한 경우에도 ‘제조물책임’을 부담하지 아니한다.',			
			'고객이 MALL에서 구매한 발마시지기를 정상적으로 사용하다가 종아리에 상처를 입은 경우, 제조사의 다른 입증이 없는 한 제품에 결함이 있다고 볼 수 있다.'
			],
            answer: 3,
            comment: '제조물책임법 제3조 제2항은 ‘피해자가 제조물의 제조업자를 알 수 없는 경우’에, 그 제조물을 영리 목적으로 판매/대여 등의 방법으로 공급한 자도 제조물책임을 지는 것으로 규정하고 있습니다. 단, 그 제조업자등을 피해자에게 상당한 기간 내에 고지해 준 경우에는 면책됩니다.※ 2018.4.19.부터 징벌적 손해배상 제도(3배 배상) 시행 유의'
			}];
    </script>
