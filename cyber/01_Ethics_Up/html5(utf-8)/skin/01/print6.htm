<BODY topmargin="0" leftmargin="0" onload="print()">
<div style="overflow:auto;">
			<p>1) 청탁금지법 적용대상 기관(청탁금지법 상 “공공기관”)</p>
			<ul>
				<li>국회, 법원, 헌법재판소, 선거관리위원회, 감사원, 국가인권위원회, 중앙행정기관 및 그 소속기관, 지방자치단체 및 시·도 교육청, 공직유관단체 및 공공기관운영법에 따른 기관, 각급 학교, 언론기관</li>
			</ul>
			<p>2) 청탁금지법 적용대상 개인(청탁금지법 상  “공직자 등”)</p>
			<ul>
				<li>공무원, 공직유관단체의 장과 임직원, 각급 학교 교직원, 언론기관 임직원, 공직자등의 배우자, 공무수행사인</li>
			</ul>
