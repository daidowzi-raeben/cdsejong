<body>
<div id="allWrap">
<div id="wrap">


	<!-- bg background -->
	<div class="main_area"></div>
	<!-- //bg background -->
		<div id="headTit"><img src="img/title.png" /></div>
	<!--div id="slogo"><img src="../images/img/s_logo.png"/></div-->

    <div id="jp_container_1" class="jp-video jp-video-360p subVideo" role="application" aria-label="media player">
		


		<!-- 영상 플레이어 -->
        <div class="jp-type-single">
            <div id="jquery_jplayer_1" class="jp-jplayer"></div>
			<div class="jpback"></div>
			<div class="jp-gui">
				<div class="jp-video-play"></div>
				<div class="jp-interface">
					<div class="jp-inbox">
						<div class="jp-util">
							<ul>
								<li><a href="javascript:;" class="u_index"><span></span></a></li>
							</ul>
						</div>
						<div class="jp-progress">
							<div class="jp-seek-bar">
								<div class="jp-play-bar"></div>
							</div>
						</div>
						<div class="jp-controls-holder">
							<div class="jp-controls">
							<button class="jp-script" role="button" tabindex="0">script</button>	
								<button class="jp-play" role="button" tabindex="0">play</button>								
								<div class="jp-current-time" role="timer" aria-label="time">&nbsp;</div>
								
								<div class="jp-duration" role="timer" aria-label="duration">&nbsp;</div>
							</div>
						</div>
						<div class="jp-volume-controls">
							<button class="jp-mute" role="button" tabindex="0">mute</button>
							<div class="jp-volume-bar">
								<div class="jp-volume-bar-value"></div>
							</div>
						</div>
						<div class="jp-toggles">
							<div class="jp-speed">
								<div class="jp-toggles-text">SPEED</div>
								<button class="speed sp2" data-speed="0">0.5</button>
								<button class="speed sp3" data-speed="2">1.0</button>
								<button class="speed sp4" data-speed="4">1.5</button>
								<button class="speed sp5" data-speed="6">2.0</button>  
							</div>
						</div>
					</div>
					<div id="paging">
						<a href="javascript:prev(3);" class="pagePrev"></a>
						<span><strong>03</strong> / 10</span>
						<a href="javascript:;" class="nextFunc pageNext" data-page="3"></a>
						<div class="click"><a href="javascript:next(3);"><img src="../images/img/btn_click.png" alt="" /></a></div>
					</div>
					<div class="jp-limit"></div> <!-- 컨트롤차단 -->
				</div>
				<!-- 스크립트 -->
				<div id="scriptBox">
					<div class="scHead">
						<div class="scTit"></div>
						<a href="javascript:;" class="scClose"><img src="../images/img/img_script_close.gif" alt="CLOSE" /></a>
					</div>
					<div class="scConfBox">
						<div class="scConf">
							<p>이번 시간에는 ESG 경영의 등장과 확산, ESG 경영과 리스크관리, ESG 경영을 통한 기업가치 창출, 그리고 ESG 경영 우수사례에 알아보겠습니다. 학습목표를 확인한 후, 본격적으로 학습을 시작해보도록 하겠습니다. 
							</p>
						</div>
					</div>
				</div>
				<!-- //스크립트 -->				<!-- 인덱스 메뉴 -->
				<div id="indexNavi"></div>
				<!-- //인덱스 메뉴 -->

			</div>
        </div>
		<!-- //영상 플레이어 -->
		

        <a href="javascript:;" class="play"><img src="../images/img/btn_play.png" alt="play" /></a>
    </div>



</div>
</div>


<div class="effectspeak01"><audio controls muted preload="auto"><source type="audio/mp3" src="../mp3/next.mp3" /></audio></div>


<link type="text/css" href="../css/jquery.mCustomScrollbar.css" rel="stylesheet" />
<script type="text/javascript" src="../js/jquery.mCustomScrollbar.concat.min.js"></script>
<script type="text/javascript">
$(function(){
	var effectAudio01 = function(){  $('.effectspeak01').find('audio')[0].play(); $('.effectspeak01').find('audio')[0].muted = false;};
	

    // win height
    var winHChk = function(){
        var winH = $(window).height();
        $('#allWrap').css('height',winH);
    }
    winHChk();
    pageInit();
    $(window).resize(function(){winHChk();});
	
	// next 넘기기, 클릭유도
	var nextEnd = false;
    var endClick = function(){
		$('.click').fadeIn(600,function(){
			$(this).fadeOut(600,function(){
				$(this).fadeIn(600,function(){
					$(this).fadeOut(600,function(){
						$(this).fadeIn(600);
					});
				});
			})
		}); 
		effectAudio01();
		nextEnd = true;
		playbar = true;
		playControl();
	}
	
	$('.nextFunc').bind('click',function(){
		var mypage = parseInt($(this).attr('data-page'));
		if (nextEnd == true){
			next(mypage);
		} else {
			next(mypage);
			return false;
		}
	});
	

	// player bar
	var playbar = true;
	var playControl = function(){
		if (playbar == false){
			$('.jp-seek-bar').css('display','none');
		} else {
			$('.jp-seek-bar').css('display','block');
			$('.jp-progress').unbind('click');
		}
	}
	$('.jp-progress').bind('click',function(){		
		next(mypage);
		return false;
	});
	playControl();


    // movie
    var movieUrl = [mp4_Name]; // 1300k, 500k
        function jplayerControll(a){
		var mUrl = movieUrl[a];
		$('#jquery_jplayer_1').jPlayer({			
			ready: function (event) {
				$(this).jPlayer('setMedia', {
					m4v: mUrl,
					poster: '../images/img/cover.jpg'
				});

				if(!navigator.userAgent.match(/Android|Mobile|iP(hone|od|ad)|BlackBerry|IEMobile|Kindle|NetFront|Silk-Accelerated|(hpw|web)OS|Fennec|Minimo|Opera M(obi|ini)|Blazer|Dolfin|Dolphin|Skyfire|Zune/)){
					$(this).jPlayer('play');
				}
			
			},
			swfPath:'js',
			supplied:'m4v',
			size: {
				width:'1280px',
				height:'720px',
				cssClass:'jp-video-360p'
			},
			useStateClassSkin: true,
			autoBlur: false,
			smoothPlayBar: true,
			keyEnabled: true,
			remainingDuration: false,
			toggleDuration: false,
		//	autohide: {restored: true, fadeIn:200},
			volume: 0.5,
			ended : function(){
                endClick();
			}
		});
	}

	var nowspeed = function(){
		var nows = $('.jp-speed').children('.on').index()-1;		
		setTimeout( function() { $('.speed').eq(nows).click(); },200);
	}

	$('.play').bind('click',function(){
		$('#jquery_jplayer_1').jPlayer('play');
		$(this).fadeOut();
		nowspeed();
	});

	$('.jp-stop').bind('click',function(){
		$('.play').fadeIn();
		nowspeed();
	});

	$('.jp-play').bind('click',function(){
		if ($('#jp_container_1').is('.jp-state-playing')){
			$('.play').fadeIn();
		} else {
			$('.play').fadeOut();
		}
		nowspeed();
	});

	if(!navigator.userAgent.match(/Android|Mobile|iP(hone|od|ad)|BlackBerry|IEMobile|Kindle|NetFront|Silk-Accelerated|(hpw|web)OS|Fennec|Minimo|Opera M(obi|ini)|Blazer|Dolfin|Dolphin|Skyfire|Zune/)){
		$('.play').fadeOut();
	} else {
		$('.play').fadeIn();
	}

	// 스피드 변경
	$('.speed').each(function(){
		$(this).bind('click',function(){
			if (!$(this).hasClass('on')){
				var dataNum = $(this).attr('data-speed');
				var speed = [0.5, 0.8, 1, 1.2, 1.5, 1.8, 2];
				$('.speed').removeClass('on');
				$(this).addClass('on');				
				$('#jquery_jplayer_1').jPlayer('option','playbackRate',speed[dataNum]);
			}
		});
	});
	$('.speed').eq(1).click();

	// 해상도 변경
	$('.resolution').each(function(){
		$(this).bind('click',function(index){
			if (!$(this).hasClass('active')){
				var dataType = $(this).attr('data-type');
				$('.resolution').removeClass('active');
				$(this).addClass('active');
	
				$('#jquery_jplayer_1').jPlayer('destroy');
				if (dataType == 'high'){ jplayerControll(0);
				} else { jplayerControll(1); }
	//			setTimeout(function() { $('#jquery_jplayer_1').jPlayer('play'); },1200);
			}
		});
	});



	// replay
	$('.jp-replay').bind('click',function(){
		$('#jquery_jplayer_1').jPlayer('stop');
		$('#jquery_jplayer_1').jPlayer('play');
		nowspeed();
	});

	jplayerControll(0);

    $(window).load(function(){
        $('.jp-gui').css('opacity','1');
    });




	// 교안 다운로드
	$('#tgDown').load('teacher_guide.html');

	// 놀이영상
	$('#tgMovie').load('movie_list.html');
	
	// 인덱스 네비
	var depth1 = 1; // 1차뎁스
	var depth2 = 3; // 2차뎁스
	$('#indexNavi').load('index_navi.html',function(){
		var de1 = depth1 - 1;
		var de2 = depth2 - 1;
		$('#navigation > ul > li:eq('+de1+') > a').addClass('on');
		$('#navigation > ul > li:eq('+de1+') ul li:eq('+de2+') a').addClass('on');
	});
	
	// 스크립트 스크롤바
	$(".scConf").mCustomScrollbar({theme:'dark',mouseWheelPixels:150});


	// 보안
	$('body').siteSecurity({
	//	f12:'y',         //f12키 막기
		rightclick: 'y' //우클릭 막기
	});

});
</script>




</body>
</html>
